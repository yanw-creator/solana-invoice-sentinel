[project]
name = "solana-invoice-sentinel"
version = "0.1.0"
description = "A non-custodial ZeroClaw skill for Solana Pay invoices and verified receipts"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "qrcode[pil]>=8.0,<9",
  "solders>=0.26,<0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
demo = ["solana>=0.36,<0.37"]

[project.scripts]
invoice-sentinel = "invoice_sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["invoice_sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
